<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F131D"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="16" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="82" y="82" width="860" height="860" rx="200" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>
  <rect x="82" y="82" width="860" height="860" rx="200" fill="url(#centerGlow)"/>

  <!-- Glyph: Modern D with Play / Speed Chevron -->
  <g filter="url(#dropShadow)">
    <!-- Vertical Bar of D -->
    <rect x="286" y="256" width="102" height="512" rx="36" fill="url(#glyphGrad)"/>
    
    <!-- Outer Arc / Loop of D -->
    <path d="M 370 256 H 570 C 690 256, 778 344, 778 512 C 778 680, 690 768, 570 768 H 370 Z" fill="url(#glyphGrad)"/>
    
    <!-- Inner Cutout -->
    <path d="M 430 358 H 550 C 630 358, 680 420, 680 512 C 680 604, 630 666, 550 666 H 430 Z" fill="#080A10"/>
    
    <!-- Speed / Forward Play Chevron -->
    <polygon points="450,400 580,512 450,624" fill="#38BDF8"/>
  </g>
</svg>
