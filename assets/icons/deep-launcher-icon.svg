<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#161A2B"/>
      <stop offset="60%" stop-color="#090B12"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>

    <!-- Top-Right Ambient Cyan Glow -->
    <radialGradient id="cyanGlow" cx="70%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom-Left Ambient Purple Glow -->
    <radialGradient id="purpleGlow" cx="28%" cy="72%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Play Glyph Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="80" y="80" width="864" height="864" rx="210" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  <rect x="80" y="80" width="864" height="864" rx="210" fill="url(#cyanGlow)"/>
  <rect x="80" y="80" width="864" height="864" rx="210" fill="url(#purpleGlow)"/>

  <!-- Subtle Top Highlight Rim -->
  <path d="M 120 160 C 220 90, 804 90, 904 160" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3" fill="none"/>

  <!-- Flawless Unified D Monogram with Cutout -->
  <g filter="url(#shadow)">
    <path fill-rule="evenodd" fill="url(#glyphGrad)"
      d="M 330 270
         H 512
         C 645 270, 754 378, 754 512
         C 754 646, 645 754, 512 754
         H 330
         C 305 754, 285 734, 285 709
         V 315
         C 285 290, 305 270, 330 270
         Z
         M 405 385
         V 639
         H 512
         C 582 639, 639 582, 639 512
         C 639 442, 582 385, 512 385
         Z" />

    <!-- Center Play/Speed Precision Chevron -->
    <path fill="url(#playGrad)"
      d="M 465 435
         C 465 425, 476 419, 485 425
         L 582 498
         C 592 505, 592 519, 582 526
         L 485 599
         C 476 605, 465 599, 465 589
         Z" />
  </g>
</svg>
